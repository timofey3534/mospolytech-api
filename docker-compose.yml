version: '3.8'

services:
  mospolytech-api:
    build: .
    container_name: mospolytech-api
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
      - PUBLIC_API_URL=https://amd.dedyn.io:15243
    volumes:
      - ./data:/app/data
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true
